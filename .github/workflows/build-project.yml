name: Build and package one upstream

on:
  workflow_call:
    inputs:
      upstream:
        type: string
        required: true
      cpu_target:
        type: string
        default: x86-64-v3

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C target-cpu=${{ inputs.cpu_target }}
      CPU_TARGET: ${{ inputs.cpu_target }}
      UPSTREAM: ${{ inputs.upstream }}
    outputs:
      artifact: ${{ steps.source.outputs.id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve the latest upstream default-branch commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('Marvisak/VIctory', 'xcl-dev/xcl', 'fxceless/victory-fork', 'Zettrox/ztrx', 'uiliannn/VItoriaBr', 'Belobug/VIctory-Belobug-AMD', 'DexNom/VIctory', 'avatarmanz/VIctory-7900XTX')
          if ($env:UPSTREAM -cnotin $allowed) { throw 'Unsupported upstream repository.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($env:CPU_TARGET -cnotin @('x86-64-v3', 'x86-64')) { throw 'Unsupported CPU target.' }
          "id=$($env:UPSTREAM.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          $url = "$env:GITHUB_API_URL/repos/$env:UPSTREAM"
          try {
              $repo = Invoke-RestMethod -Uri $url -Headers $headers
              $branch = [Uri]::EscapeDataString($repo.default_branch)
              $commit = Invoke-RestMethod -Uri "$url/commits/$branch" -Headers $headers
          } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              # Only an upstream repository/commit HTTP 404 is skippable.
              # Compiler errors, permissions, rate limits and dependency errors still fail the batch.
              $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
              [System.IO.Directory]::CreateDirectory($dist) | Out-Null
              $info = [ordered]@{
                  upstream = $env:UPSTREAM; upstream_url = "https://github.com/$env:UPSTREAM"
                  status = 'unavailable'; http_status = 404; source_sha = $null
                  source_branch = $null; checked_utc = [DateTime]::UtcNow.ToString('o')
                  workflow = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                  reason = 'HTTP 404: project source unavailable; cannot compile / 项目404，无法下载源码，无法编译'
              }
              $utf8 = [System.Text.UTF8Encoding]::new($false)
              [System.IO.File]::WriteAllText((Join-Path $dist 'metadata.json'), ($info | ConvertTo-Json -Depth 8), $utf8)
              [System.IO.File]::WriteAllText((Join-Path $dist 'RELEASE-NOTES.md'), "$env:UPSTREAM : $($info.reason)", $utf8)
              "available=false" >> $env:GITHUB_OUTPUT
              Write-Host "$env:UPSTREAM : $($info.reason)"
              return
          }
          "available=true" >> $env:GITHUB_OUTPUT
          if ($commit.sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid upstream SHA.' }
          "sha=$($commit.sha)" >> $env:GITHUB_OUTPUT
          "branch=$($repo.default_branch)" >> $env:GITHUB_OUTPUT
          "id=$($env:UPSTREAM.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          Write-Host "Building $env:UPSTREAM@$($commit.sha) from $($repo.default_branch)"

      - name: Check out exactly the resolved upstream SHA
        if: steps.source.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install upstream Rust toolchain and compile optimized release
        if: steps.source.outputs.available == 'true'
        id: compile
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'rust-toolchain.toml') {
            rustup show
          } else {
            rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustup default stable
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = if ($env:UPSTREAM -eq 'xcl-dev/xcl') { 'xcl' } else { 'victory' }
          if ($env:UPSTREAM -ceq 'DexNom/VIctory') {
              & .\Initialize-FormatTables.ps1
              if (-not $?) { throw 'DexNom format table initialization failed.' }
          }
          $compileStarted = [DateTime]::UtcNow.ToString('o')
          $buildArgs = @('build', '--release', '--locked', '--package', $package, '--target', 'x86_64-pc-windows-msvc')
          if ($env:UPSTREAM -ceq 'DexNom/VIctory') { $buildArgs += '--bins' } else { $buildArgs += @('--bin', $package) }
          cargo @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "started_utc=$compileStarted" >> $env:GITHUB_OUTPUT
          "completed_utc=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT

      - name: Package owner/repository portable archive and verify extraction
        if: steps.source.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          COMPILE_STARTED_UTC: ${{ steps.compile.outputs.started_utc }}
          COMPILED_UTC: ${{ steps.compile.outputs.completed_utc }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $repo = $env:UPSTREAM
          $parts = $repo.Split('/')
          $owner, $name = $parts
          $id = $repo.Replace('/', '-')
          $sha = $env:SOURCE_SHA
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $sha) { throw 'Checkout SHA mismatch.' }
          $gitVersion = (& git --version | Out-String).Trim()
          $rustVersion = (& rustc --version | Out-String).Trim()
          $commitDate = (& git show -s --format=%cI HEAD | Out-String).Trim()
          $stage = Join-Path $env:RUNNER_TEMP ('package-' + [Guid]::NewGuid().ToString('N'))
          $root = Join-Path (Join-Path $stage $owner) $name
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          [System.IO.Directory]::CreateDirectory($root) | Out-Null
          [System.IO.Directory]::CreateDirectory($dist) | Out-Null
          $isXcl = $repo -eq 'xcl-dev/xcl'
          $binaryName = if ($isXcl) { 'xcl.exe' } else { 'victory.exe' }
          $binary = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release/$binaryName"
          Copy-Item -LiteralPath $binary -Destination $root
          if ($repo -ceq 'DexNom/VIctory') {
              foreach ($extra in @('victory-play.exe', 'victory-warm.exe')) {
                  Copy-Item -LiteralPath (Join-Path (Split-Path $binary -Parent) $extra) -Destination $root
              }
          }
          & (Join-Path $root $binaryName) --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable --help failed.' }
          foreach ($file in @('LICENSE', 'README.md', 'THIRD_PARTY.md', 'victory.example.toml')) {
              if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $root }
          }
          function Get-Archive([string]$Url, [string]$Expected, [string]$Name) {
              $zip = Join-Path $stage ($Name + '.zip')
              Invoke-WebRequest -Uri $Url -OutFile $zip
              if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Expected) { throw "Bad $Name checksum." }
              $folder = Join-Path $stage $Name
              Expand-Archive -LiteralPath $zip -DestinationPath $folder
              return $folder
          }
          function Copy-Notices([string]$From, [string]$To) {
              $files = @(Get-ChildItem -LiteralPath $From -Recurse -File | Where-Object { $_.Name -match '(?i)license|notice|copying' })
              if ($files.Count -eq 0) { throw 'Missing dependency license notices.' }
              foreach ($file in $files) {
                  $dest = Join-Path $To ([System.IO.Path]::GetRelativePath($From, $file.FullName))
                  [System.IO.Directory]::CreateDirectory((Split-Path -Parent $dest)) | Out-Null
                  Copy-Item -LiteralPath $file.FullName -Destination $dest
              }
          }
          if ($isXcl) {
              $dxc = Get-Archive 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1' 'dxc'
              $agility = Get-Archive 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' '70489669c2bbeaf318b62d72b0ac3e753d521387bfc848c9763791c4e920bfcc' 'agility'
              foreach ($dll in @('dxcompiler.dll', 'dxil.dll')) { Copy-Item -LiteralPath (Join-Path $dxc "bin/x64/$dll") -Destination $root }
              $d3d12 = Join-Path $root 'D3D12'
              [System.IO.Directory]::CreateDirectory($d3d12) | Out-Null
              Copy-Item -Path (Join-Path $agility 'build/native/bin/x64/*.dll') -Destination $d3d12
              Copy-Notices $dxc (Join-Path $root 'licenses/DXC')
              Copy-Notices $agility (Join-Path $root 'licenses/Agility')
          }
          $runtimePreset = $null
          $runtimeEnv = [ordered]@{}
          $presetCommands = 'rem No project-specific runtime preset.'
          if ($repo -ceq 'fxceless/victory-fork') {
              $runtimeEnv = [ordered]@{
                  VICTORY_LEVELS_ON_DEMAND = '1'; VICTORY_ASYNC_SUBMIT = '1'; VICTORY_QUEUE2 = '1'
                  VICTORY_INDIRECT_WINDOW = '1'; VICTORY_TEXTURE_NO_WAIT = '1'; VICTORY_MERGE_GAP = '64'
                  VICTORY_MERGE_RUNS = '4096'; VICTORY_STAGING_POOL = '0'; VICTORY_COPY_PLAIN = '1'
                  VICTORY_JOIN_PARTS = '1'; VICTORY_BACK_OWN_VIEW = '1'; VICTORY_INDIRECT_GATHER = '1'
                  VICTORY_CARD_REHASH_RUNS = '1'; VICTORY_CARD_WINDOWS_MB = '2048'
                  VICTORY_CARD_BUFFERS_MIN_KB = '64'; VICTORY_CARD_BUFFERS_MB = '1280'
                  VICTORY_TEXTURE_BACK = '1'; VICTORY_CARD_HASH_LEN = '1'; VICTORY_SHADER_OPT = '63'
                  VICTORY_LOOKUP_CACHE = '1'
              }
              $runtimePreset = [ordered]@{
                  name = 'fxceless-readme-run293'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Run-279 switches plus the measured run-293 lookup cache; unmeasured experiments remain upstream defaults'
                  reference_sha = '988aa41608cace81a54923e7d26ff6b561e3cf30'
                  readme = 'https://github.com/fxceless/victory-fork/blob/988aa41608cace81a54923e7d26ff6b561e3cf30/README.md'
                  diagnostics_readme = 'https://github.com/fxceless/victory-fork/blob/988aa41608cace81a54923e7d26ff6b561e3cf30/diagnostics/README.md'
                  reported_hardware = 'Windows 11; i7-14700KF; RTX 4070 12GB; 32GB RAM'
                  reported_fps = 'README: 9-12 FPS in light scenes, 5-6 in heavy outdoor views; run-293 lookup cache saved about 14 ms/frame at equal draws'
              }
          } elseif ($repo -ceq 'avatarmanz/VIctory-7900XTX') {
              # Read literal settings from the exact compiled source. Do not execute its play script.
              $playPath = 'scripts/play.ps1'
              $play = Get-Content -LiteralPath $playPath -Raw
              $base = [regex]::Match($play, '(?s)\$settings\s*=\s*@\{(?<base>.*?)\r?\n\}')
              $fast = [regex]::Match($play, '(?s)\} else \{(?<fast>.*?)\r?\n\}')
              if (-not $base.Success -or -not $fast.Success) { throw 'Upstream play.ps1 format changed; review its performance preset.' }
              foreach ($entry in [regex]::Matches($base.Groups['base'].Value, "(VICTORY_[A-Z0-9_]+)\s*=\s*'([^']*)'")) {
                  $runtimeEnv[$entry.Groups[1].Value] = $entry.Groups[2].Value
              }
              foreach ($entry in [regex]::Matches($fast.Groups['fast'].Value, '\$settings\.(VICTORY_[A-Z0-9_]+)\s*=\s*''([^'']*)''')) {
                  $runtimeEnv[$entry.Groups[1].Value] = $entry.Groups[2].Value
              }
              if ($runtimeEnv.Count -lt 15 -or $runtimeEnv['VICTORY_THIN'] -cne '1') { throw 'Incomplete upstream performance preset.' }
              $runtimeEnv.Remove('VICTORY_D3D12_DRED')
              $runtimePreset = [ordered]@{
                  name = 'avatarmanz-upstream-play-fast'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Exact source scripts/play.ps1 default performance settings, without timing/debug instrumentation or optional ray tracing'
                  reference_sha = $sha; readme = "https://github.com/$repo/blob/$sha/scripts/play.ps1"
                  diagnostics_readme = "https://github.com/$repo/blob/$sha/docs/findings.md"
                  reported_hardware = 'Windows 11; i9-12900K; RX 7900 XTX; 64GB RAM; 1440p'
                  reported_fps = 'README: 13-20 FPS indoors, 19-22 on the boat, 6-10 in heavy street scenes; AMD tuning, NVIDIA unverified'
              }
              Copy-Item -LiteralPath $playPath -Destination (Join-Path $root 'play.upstream.ps1')
              if (Test-Path -LiteralPath 'docs') { Copy-Item -LiteralPath 'docs' -Destination (Join-Path $root 'docs') -Recurse }
          } elseif ($repo -ceq 'DexNom/VIctory') {
              $runtimeEnv = [ordered]@{ VICTORY_RAY_TRACING = '0' }
              $runtimePreset = [ordered]@{
                  name = 'dexnom-no-rt'; kind = 'runtime-environment'; compile_profile = 'release'
                  basis = 'Upstream README no-RT path, also recommended there for untested NVIDIA; all three portable executables included'
                  reference_sha = $sha; readme = "https://github.com/$repo/blob/$sha/README.md"
                  diagnostics_readme = "https://github.com/$repo/blob/$sha/README.md#experimental-nvidia"
                  reported_hardware = 'AMD Radeon primary target; NVIDIA gameplay untested upstream'
                  reported_fps = 'No package gameplay benchmark; optional ray tracing and FSR must be selected explicitly using victory-play.exe'
              }
          }
          if ($null -ne $runtimePreset) {
              $clearEnv = @('VICTORY_GPU_TIMING', 'VICTORY_D3D12_DRED', 'VICTORY_D3D12_DEBUG', 'VICTORY_D3D12_GBV', 'VICTORY_D3D12_WARP', 'VICTORY_PROFILE', 'VICTORY_BACK_READS', 'VICTORY_WAVE_WIDE')
              $runtimePreset.compiled_source_readme = "https://github.com/$repo/blob/$sha/README.md"
              $runtimePreset.environment = $runtimeEnv; $runtimePreset.clear_environment = $clearEnv
              $runtimePreset.extra_arguments = @('--console', 'series-x'); $runtimePreset.gameplay_tested = $false
              foreach ($entry in $runtimeEnv.GetEnumerator()) {
                  if ($entry.Key -notmatch '^VICTORY_[A-Z0-9_]+$' -or $entry.Value -notmatch '^[A-Za-z0-9_.+-]+$') { throw 'Unsafe runtime preset literal.' }
              }
              $commands = @('rem Upstream runtime performance preset; see PERFORMANCE.md.')
              $commands += @($runtimeEnv.GetEnumerator() | ForEach-Object { 'set "' + $_.Key + '=' + $_.Value + '"' })
              $commands += @($clearEnv | ForEach-Object { 'set "' + $_ + '="' })
              $commands += @('if /i "%~1"=="--print-runtime-preset" (', ('  echo Runtime preset: ' + $runtimePreset.name), '  set VICTORY_', '  popd', '  exit /b 0', ')', 'echo Using upstream performance preset; FPS is hardware dependent.')
              $presetCommands = $commands -join [Environment]::NewLine
              [System.IO.File]::WriteAllText((Join-Path $root 'RUNTIME-PRESET.json'), ($runtimePreset | ConvertTo-Json -Depth 8), $utf8)
              $performanceNotes = @(
                  '# Runtime performance preset / 运行性能预设'
                  ''
                  'Use Launch.bat, or drag the game EXE onto it, to apply these runtime settings before the game starts.'
                  '通过 Launch.bat 启动或将游戏 EXE 拖到它上面，才能应用运行参数；单独运行 victory.exe 不会自动应用。'
                  'Optimized Release: opt-level=3, fat LTO, one codegen unit, static CRT; no diagnostics feature.'
                  ('CPU target / CPU 指令集: ' + $env:CPU_TARGET)
                  ('Basis / 来源: ' + $runtimePreset.basis)
                  ('Reference / 参数文档: ' + $runtimePreset.readme)
                  ('Upstream observations / 上游测量: ' + $runtimePreset.reported_fps)
                  'Compiler optimization cannot guarantee 30 FPS or fix missing rendering features and upstream crashes.'
                  '编译优化无法保证稳定30帧，也不能修复上游尚未实现的渲染功能或所有崩溃。本包未做游戏帧率实测。'
                  'Shader opt 127 and forced wave64 are not enabled. VRAM budgets are partial budgets, not total memory requirements.'
                  '未开启 shader opt 127 或强制 wave64；显存窗口和缓冲预算只是部分预算。'
                  ''
                  '~~~bat'
              )
              $performanceNotes += @($runtimeEnv.GetEnumerator() | ForEach-Object { 'set "' + $_.Key + '=' + $_.Value + '"' })
              $performanceNotes += @('~~~', '', 'Inspect without launching: Launch.bat --print-runtime-preset')
              [System.IO.File]::WriteAllLines((Join-Path $root 'PERFORMANCE.md'), $performanceNotes, $utf8)
          }
          $launcher = @'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          pushd "%~dp0" >nul 2>&1
          if errorlevel 1 exit /b 1
          set "XCL_DXC_DIR=%~dp0"
          set "XCL_D3D12_DIR=%~dp0D3D12"
          set "XCL_DATA_ROOT=%~dp0data"
          set "VICTORY_CACHE_DIR=%~dp0cache"
          set "VICTORY_DATA_DIR=%~dp0data"
          rem PROJECT_RUNTIME_PRESET
          if exist "%~dp0xcl.exe" (
              if "%~1"=="" (
                  start "" /wait "%~dp0xcl.exe"
              ) else (
                  "%~dp0xcl.exe" run "%~1"
              )
              goto :finish
          )
          set "GAME=%~1"
          if not defined GAME set /p "GAME=Enter the full path to the game's EXE: "
          set "GAME=%GAME:"=%"
          if not exist "%GAME%" (
              echo [ERROR] Game executable not found.
              pause
              popd
              exit /b 1
          )
          for %%I in ("%GAME%") do set "VICTORY_GAME_DIR=%%~dpI"
          "%~dp0victory.exe" run "%GAME%" --execute
          :finish
          set "RESULT=%ERRORLEVEL%"
          echo.
          echo Launcher exited with code %RESULT%.
          pause
          popd
          exit /b %RESULT%
          '@
          $launcher = $launcher.Replace('rem PROJECT_RUNTIME_PRESET', $presetCommands)
          if ($null -ne $runtimePreset) {
              $launcher = $launcher.Replace('victory.exe" run "%GAME%" --execute', 'victory.exe" run "%GAME%" --execute --console series-x')
          }
          [System.IO.File]::WriteAllText((Join-Path $root 'Launch.bat'), (($launcher -replace '\r?\n', [Environment]::NewLine) + [Environment]::NewLine), [System.Text.Encoding]::ASCII)
          $instructions = @'
          Extract the entire archive before use. Do not run directly inside the ZIP.
          Open Launch.bat to choose or enter the game's main EXE, or drag its EXE onto Launch.bat.
          VIctory variants ask for a path; XCL opens its own game picker.
          The launcher keeps settings, saves and caches in data/ and cache/ beside the executable.
          No Rust or full Windows SDK installation is needed to use the binaries.
          XCL includes DXC and D3D12 Agility. Gaming Services must already be installed in Windows.
          Supported Windows updates, compatible graphics drivers/hardware, and your own unpacked
          game files are still required. No game files or console SDK components are included.
          These experimental upstream projects may fail or reset the graphics driver.
          Compilation and CLI/ZIP checks do not verify rendering, performance or gameplay.
          See README.md for the original project's requirements and known limitations.
          '@
          [System.IO.File]::WriteAllText((Join-Path $root 'START-HERE.txt'), $instructions, $utf8)
          & git archive --format=zip "--output=$(Join-Path $root 'source.zip')" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          $buildUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $binaryHash = (Get-FileHash -LiteralPath (Join-Path $root $binaryName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $info = [ordered]@{
              upstream = $repo; upstream_url = "https://github.com/$repo"; source_sha = $sha; status = 'built'
              source_branch = $env:SOURCE_BRANCH; source_commit_date = $commitDate
              source_url = "https://github.com/$repo/commit/$sha"; workflow = $buildUrl
              git_version = $gitVersion; rust_version = $rustVersion
              compiled_started_utc = $env:COMPILE_STARTED_UTC; compiled_utc = $env:COMPILED_UTC
              compiled_beijing = [DateTimeOffset]::Parse($env:COMPILED_UTC).ToOffset([TimeSpan]::FromHours(8)).ToString("yyyy-MM-dd HH:mm:ss 'UTC+08:00'")
              built_utc = [DateTime]::UtcNow.ToString('o'); binary = $binaryName; binary_sha256 = $binaryHash
              profile = 'release'; target = 'x86_64-pc-windows-msvc'; crt = 'static'
              optimization = [ordered]@{ opt_level = 3; lto = 'fat'; codegen_units = 1; cpu_target = $env:CPU_TARGET; diagnostics = $false; rustflags = $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS }
              format_table_sha256 = $(if ($repo -ceq 'DexNom/VIctory') { (Get-FileHash -LiteralPath 'crates/victory-formats/src/bcpack-tables.bin' -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null })
              dxc = $(if ($isXcl) { 'v1.9.2609' } else { $null })
              agility = $(if ($isXcl) { '1.620.2' } else { $null })
              dependency_archives = $(if ($isXcl) { @(
                  @{ url = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip'; sha256 = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1' }
                  @{ url = 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg'; sha256 = '70489669c2bbeaf318b62d72b0ac3e753d521387bfc848c9763791c4e920bfcc' }
              ) } else { @() })
              runtime_preset = $runtimePreset
              gameplay_tested = $false
          }
          [System.IO.File]::WriteAllText((Join-Path $root 'BUILD-INFO.json'), ($info | ConvertTo-Json -Depth 8), $utf8)
          $manifest = @(Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName | ForEach-Object {
              (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          })
          [System.IO.File]::WriteAllLines((Join-Path $root 'SHA256SUMS.txt'), $manifest, $utf8)
          $zipName = "$id-windows-x64-$($sha.Substring(0, 12)).zip"
          $zip = Join-Path $dist $zipName
          Compress-Archive -LiteralPath (Join-Path $stage $owner) -DestinationPath $zip -CompressionLevel Optimal
          $check = Join-Path $stage 'verified'
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $extracted = Join-Path (Join-Path $check $owner) $name
          foreach ($line in [System.IO.File]::ReadAllLines((Join-Path $extracted 'SHA256SUMS.txt'))) {
              $file = Join-Path $extracted $line.Substring(66)
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $line.Substring(0, 64)) { throw "ZIP integrity failed: $file" }
          }
          & (Join-Path $extracted $binaryName) --help
          if ($LASTEXITCODE -ne 0) { throw 'Extracted executable failed --help.' }
          if ($null -ne $runtimePreset) {
              Push-Location -LiteralPath $extracted
              try {
                  $presetOutput = & cmd.exe /d /c 'Launch.bat --print-runtime-preset' | Out-String
                  if ($LASTEXITCODE -ne 0) { throw 'Runtime preset launcher check failed.' }
              } finally { Pop-Location }
              foreach ($entry in $runtimeEnv.GetEnumerator()) {
                  if ($presetOutput -notmatch ('(?m)^' + [regex]::Escape($entry.Key + '=' + $entry.Value) + '\r?$')) { throw "Runtime switch missing: $($entry.Key)" }
              }
              foreach ($entry in $clearEnv) {
                  if ($presetOutput -match ('(?m)^' + [regex]::Escape($entry) + '=')) { throw "Debug/timing variable was not cleared: $entry" }
              }
              $packedPreset = Get-Content -LiteralPath (Join-Path $extracted 'RUNTIME-PRESET.json') -Raw | ConvertFrom-Json
              if ($packedPreset.name -cne $runtimePreset.name -or $packedPreset.reference_sha -cne $runtimePreset.reference_sha) { throw 'Packed runtime preset mismatch.' }
              Write-Host "Verified runtime preset: $($runtimePreset.name); $($runtimeEnv.Count) variables; Series X"
          }
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(($zip + '.sha256'), "$zipHash  $zipName", $utf8)
          $info.archive = $zipName
          $info.archive_sha256 = $zipHash
          $info.size_bytes = (Get-Item -LiteralPath $zip).Length
          [System.IO.File]::WriteAllText((Join-Path $dist 'metadata.json'), ($info | ConvertTo-Json -Depth 8), $utf8)
          $notes = @(
              "## $repo - Windows x64 portable build / 便携构建"
              "- Original repository / 原仓库: https://github.com/$repo"
              "- Git commit / 编译源码版本: $($sha.Substring(0, 12))"
              "- Source / 源码: https://github.com/$repo/commit/$sha"
              "- Compile completed / 编译完成时间: $($info.compiled_beijing)"
              "- Compile completed UTC: $($info.compiled_utc)"
              "- Branch / 分支: $env:SOURCE_BRANCH"
              "- Commit date / 提交时间: $commitDate"
              "- Git client / Git 工具版本: $gitVersion"
              "- Rust: $rustVersion"
              "- Build / 构建记录: $buildUrl"
              "- Package layout / 解压目录: $repo/"
              "- Archive / 压缩包: $zipName ($($info.size_bytes) bytes)"
              "- SHA-256: $zipHash"
              ''
              'Extract the complete ZIP and open Launch.bat inside the owner/repository folder.'
              '完整解压，在“原作者/仓库名”目录中运行 Launch.bat。'
              'Includes executable, launcher, exact source.zip, notices and checksums.'
              '包含程序、启动器、对应源码、许可证和校验信息。'
              'No game data. Supported Windows/GPU and your own game files are required.'
              '不含游戏文件；仍需满足上游 Windows/显卡要求并自行提供游戏文件。'
              'XCL includes DXC/Agility; Windows Gaming Services is still a system prerequisite.'
              'XCL 已附 DXC/Agility，但 Gaming Services 仍需系统安装。'
              'Verification: release compilation, CLI --help and extracted-file hashes passed; gameplay/GPU rendering not tested.'
              '验证：Release 编译、命令行帮助和解压文件校验通过；未验证游戏运行或 GPU 渲染。'
          )
          [System.IO.File]::WriteAllLines((Join-Path $dist 'RELEASE-NOTES.md'), $notes, $utf8)
          Write-Host "Verified archive: $zipName; upstream: $sha; SHA256: $zipHash"

      - name: Transfer verified packages or explicit 404 status to publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source.outputs.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
